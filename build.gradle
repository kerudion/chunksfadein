plugins {
    id "java"
    id "fabric-loom" version "1.13-SNAPSHOT" apply false
    id "net.minecraftforge.gradle" version "6.0.+" apply false
    id "org.parchmentmc.librarian.forgegradle" version "1.+" apply false
    id "org.spongepowered.mixin" version "0.7.+" apply false
}

subprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    repositories {
        mavenCentral()
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.blamejared.com" }
        maven { url = "https://maven.parchmentmc.org/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public" }
        maven { url = "https://maven.minecraftforge.net/" }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    version = project.version
    group = project.group

    boolean isFabric = it.name == "fabric"

    processResources {
        var expandProps = [
                "version"                : project.version,
                "minecraft_version_range": isFabric ? project.minecraft_version_range_fabric : project.minecraft_version_range_forge,
                "sodium_version_range"   : project.sodium_version_range_fabric,
                "iris_version_range"     : project.iris_version_range_fabric,
                "embeddium_version_range": project.embeddium_version_range,
                "oculus_version_range"   : project.oculus_version_range,
        ]

        filesMatching(["fabric.mod.json", "META-INF/mods.toml"]) {
            expand expandProps
        }

        inputs.properties(expandProps)
    }
}
