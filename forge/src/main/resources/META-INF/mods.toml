modLoader = "javafml"
loaderVersion = "*"
license = "GPLv3"

[[mods]]
modId = "chunksfadein"
version = "${version}"
displayName = "Chunks Fade In"

logoFile = "icon.png"
authors = "kerudion (koteinik)"
credits = "IMS212, IMB11, cadenkriese, felix14_v2, embeddedt, M4ximumPizza, hexadecimal233, fefe_du_973, yejianfeng, moorey5107, theRookieCoder, qznfbnj"
description = '''
Adds fade-in and motion animations for chunks!
'''

mixinConfigs = [
    "chunksfadein_mc.mixins.json",
    "chunksfadein_dh.mixins.json",
    "chunksfadein_iris.mixins.json",
    "chunksfadein_sodium.mixins.json",
]

[[dependencies.chunksfadein]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.chunksfadein]]
modId = "oculus"
mandatory = false
versionRange = "${oculus_version_range}"
ordering = "NONE"
side = "CLIENT"
